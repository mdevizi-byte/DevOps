name: Static site CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_html:
    name: Validate HTML and links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run HTMLHint
        run: npx --yes htmlhint "Progetto devOps/**/*.html"

      - name: Check broken local links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("Progetto devOps")
          href_pattern = re.compile(r'href=["\']([^"\']+)["\']', re.IGNORECASE)

          for html_file in root.rglob("*.html"):
              content = html_file.read_text(encoding="utf-8", errors="ignore")

              for match in href_pattern.finditer(content):
                  href = match.group(1).strip()

                  if href.startswith(("http://", "https://", "mailto:", "tel:", "#")):
                      continue

                  target_path = href.split("#", 1)[0].split("?", 1)[0]
                  if not target_path:
                      continue

                  resolved = (html_file.parent / target_path).resolve()
                  if not resolved.exists():
                      print(f"Broken local link in {html_file}: {href}")
                      sys.exit(1)
          PY

  build_docker:
    name: Build Docker image
    needs: validate_html
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/mdevizi-byte/devops:latest
            ghcr.io/mdevizi-byte/devops:${{ github.sha }}

  deploy_pages:
    name: Deploy to GitHub Pages
    needs: build_docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          mkdir -p site
          cp -R "Progetto devOps/." site/
          cp "Progetto devOps/PROGETTO DevOps ( HTML ).html" site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
